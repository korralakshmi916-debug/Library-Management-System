<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: lightseagreen;
            background-image: url("G.webp");
        }

        .container {
            width: 80%;
            margin: 30px auto;
            color:rgb(0, 217, 255);
           
 padding: 25px;
            border-radius: 12px;
        }
           

        h1 {
            text-align: center;
            color:purple;
        }

        .form {
            display: flex;
            gap: 10px;
        }

        input {
            padding: 12px;
            flex: 1;
            font: size 50px;
        }

        button {
            padding: 12px 20px;
            background: orangered;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background:royalblue;
        }

        #search {
            width: 97%;
            margin-top: 30px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background:slateblue;
            color:greenyellow;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 3px solid rgb(13, 231, 166);
        }

        .delete {
            background: red;
            padding: 5px 12px;
        
        }
       
     
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Library Management System</h1>

    <!-- TOP INPUT -->
    <div class="form">

        <input type="text"
               id="bookName"
               placeholder="Enter Book Name">

        <input type="text"
               id="authorName"
               placeholder="Enter Author Name">

        <button onclick="addBook()">Add Book</button>

    </div>

    <!-- SEARCH -->
    <input type="text"
           id="search"
           placeholder="Search Book..."
           onkeyup="searchBook()">

    <!-- TABLE -->
    <table>

        <thead>
            <tr>
                <th>S.No</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookTable">
            <!-- Added books will appear here -->
        </tbody>

    </table>

</div>


<script>

let books = [];

function addBook() {

    let bookName = document.getElementById("bookName").value;
    let authorName = document.getElementById("authorName").value;

    if (bookName === "" || authorName === "") {
        alert("Please enter Book Name and Author Name");
        return;
    }

    // Add book to array
    books.push({
        name: bookName,
        author: authorName,
        status: "Available"
    });

    // Clear inputs
    document.getElementById("bookName").value = "";
    document.getElementById("authorName").value = "";

    // Update table
    displayBooks();
}


function displayBooks() {

    let table = document.getElementById("bookTable");

    table.innerHTML = "";

    books.forEach(function(book, index) {

        let row = `
            <tr>
                <td>${index + 1}</td>

                <td>${book.name}</td>

                <td>${book.author}</td>

                <td class="status">${book.status}</td>

                <td>
                    <button class="delete"
                            onclick="deleteBook(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

        table.innerHTML += row;
    });
}


function deleteBook(index) {

    books.splice(index, 1);

    displayBooks();
}


function searchBook() {

    let search = document
        .getElementById("search")
        .value
        .toLowerCase();

    let rows = document
        .getElementById("bookTable")
        .getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {

        let bookName = rows[i]
            .getElementsByTagName("td")[1]
            .innerText
            .toLowerCase();

        if (bookName.includes(search)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}

</script>

</body>
</html>
